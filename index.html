<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ねっこ</title>
  <link rel="manifest" href="/manifest.webmanifest?v=2">
  <link rel="icon" type="image/png" href="/icon.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#0d0800">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ねっこ">
  <meta property="og:title" content="ねっこ">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nekko-weld.vercel.app">
  <meta property="og:image" content="https://nekko-weld.vercel.app/icon.png?v=3">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ねっこ">
  <meta name="twitter:image" content="https://nekko-weld.vercel.app/icon.png?v=3">
  <!-- 日本語フォントはオンライン時の見栄え向上（未取得でも serif フォールバックで表示可）。
       Service Worker が初回取得後にキャッシュしてオフラインでも使えるようにする。

       ふつうの rel="stylesheet" で読むと、この取得が終わるまでブラウザは本文を
       描き始めない（描画をブロックする読み込み）。フォントは「あれば嬉しい」ものなのに、
       電波が悪い・取得に失敗する状況では、そのタイムアウトを待つあいだ画面が
       body の背景色（黒）のまま止まる。外に出られない環境での実測で、
       表示までが約13秒かかっていた。
       そこで rel="preload" で先に取りに行き、届いてから onload で stylesheet に
       切り替える。こうすると取得を待たずに画面が出て、フォントは届き次第あとから効く。
       JSが無効なときのために noscript にも同じものを置く（そちらは従来どおりブロックする）。

       注意：盤は Canvas で文字を描いており、DOM と違って**あとからフォントが来ても
       勝手に描き直らない**。読み込み完了で描き直す仕掛けが ShogiBoard.jsx にある。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho+B1:wght@400;600&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho+B1:wght@400;600&display=swap">
  </noscript>
  <!-- アイコンフォントは main.jsx で自ホスト読み込み（CDN依存を排除）-->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0800; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(26,15,0,0.2); border-radius: 2px; }
    @keyframes nekko-finger-up {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes nekko-finger-down {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(6px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
