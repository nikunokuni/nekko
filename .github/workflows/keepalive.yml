# Supabase の一時停止よけ。1日1回、いちばん軽いやり取りを2本だけ投げる。
#
#   無料プランは「7日間まったくリクエストが無い」とプロジェクトを一時停止する。
#   止まると復帰はダッシュボードからの手動操作で、アプリ側からは何もできない
#   ―― 利用者から見ると「ある日ログインできなくなったアプリ」になる。
#
#   実際には誰かが週1回アプリを開けば止まらない（ログイン済みで開くだけで
#   profiles / trees / nodes / kifus に7本ほど読みに行く）。ただしそれは
#   「誰かが必ず開く」ことに賭けている状態で、旅行や忙しい週で1回抜けると止まる。
#   利用者の行動に依存させないために、ここで機械が代わりに叩く。
#
#   最初は trees を1行読むだけだった。それでも毎日 HTTP 200 は返っていたのに、
#   Supabase からは「7日以上まともな活動が無く、近いうちに一時停止する予定」
#   という予告メールが届いた（2026-08-31）。anon キーの読みは RLS に弾かれて
#   空配列が返るので、向こうの数え方では「十分な活動」に入らないらしい。
#   **届いていることと、活動と見なされることは別だった。**
#   そこで読みに加えて、1行だけ書き換える ping() を呼ぶ（20260831_keepalive_ping.sql）。
name: Keep-alive

on:
  schedule:
    # 毎日 03:17 UTC（日本時間 12:17）。7日の猶予に対して3日おきでも計算は合うが、
    # GitHub の cron は混雑時に遅れる・丸ごと飛ぶことがあるので毎日にしてある。
    # 1回あたりリクエスト2本・実行10秒ほどなので、頻度を上げても負担はほぼ無い。
    # 半端な分（:17）なのは、毎時0分がいちばん混んで遅延しやすいため。
    - cron: "17 3 * * *"
  # 止まりかけを手で確かめたいとき用（Actions タブから実行できる）
  workflow_dispatch:

# 遅延で前回分と重なっても、同時に2本走らせる意味は無い
concurrency:
  group: keepalive
  cancel-in-progress: false

# 何も読み書きしないので権限は要らない（既定の write を明示的に外す）
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # 通信の待ちしか無いので、詰まったら早めに諦める
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 叩く先（ねっこ本番）のプロジェクトID。秘密ではない
          # ―― この値はフロントのバンドルに埋め込まれて配布されている。
          # ここに直書きするのは、Secrets の中身は登録したあと誰にも見えず、
          # 「本番とは別のプロジェクトを叩いて緑になり続ける」事故を
          # 人間が見つけられないため。機械に突き合わせさせる。
          EXPECTED_HOST:     twdfqzugcfonktmscwij.supabase.co
        run: |
          set -euo pipefail

          # 秘密が未設定のまま緑になるのが一番まずい。
          # 「見張っているつもりで何も投げていない」状態は、
          # 止まってから初めて分かる（＝手遅れになってから分かる）ので、
          # 未設定はここで落とす。
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY が未設定です。リポジトリの Settings → Secrets and variables → Actions に登録してください（値は .env の VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY と同じ）。"
            exit 1
          fi

          # 宛先が本番と同じプロジェクトかを確かめる。
          # HTTP 200 が返ってきても、それは「どこかの Supabase に届いた」
          # としか言っていない。本番の一時停止よけとして意味を持つのは
          # 宛先が一致しているときだけなので、ここで確定させる。
          # 値そのものは出さない（Secrets はログでマスクされて読めないため、
          # 出しても「***」にしかならない）。一致・不一致だけを出す。
          host="${SUPABASE_URL#*://}"
          host="${host%%/*}"
          if [ "${host}" != "${EXPECTED_HOST}" ]; then
            echo "::error::SUPABASE_URL の宛先が想定（${EXPECTED_HOST}）と違います。Secrets の SUPABASE_URL を、Vercel の VITE_SUPABASE_URL と同じ値に直してください。別プロジェクトを叩いていると、この処理が緑でも本番は7日で止まります。"
            exit 1
          fi
          echo "宛先OK: ${EXPECTED_HOST}"

          # 末尾の / があってもURLが壊れないようにしておく
          base="${SUPABASE_URL%/}"
          body="$(mktemp)"

          # 3回試して、最後の応答を status に残す。
          # 1回きりだと、たまたまの通信断で「止まりかけ」と区別が付かない
          request() {
            local method="$1" path="$2" data="${3-}"
            local attempt
            # 送るものが無いときに -d "" を渡すと空ボディのPOSTになってしまうので、
            # 引数そのものを組み立てて分ける
            local -a payload=()
            if [ -n "${data}" ]; then payload=(-d "${data}"); fi

            for attempt in 1 2 3; do
              status="$(curl -sS -m 30 -o "${body}" -w "%{http_code}" \
                -X "${method}" \
                -H "apikey: ${SUPABASE_ANON_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                "${payload[@]}" \
                "${base}${path}")" || status="000"

              if [ "${status}" = "200" ]; then
                return 0
              fi

              echo "attempt ${attempt}: ${method} ${path} → HTTP ${status}"
              head -c 500 "${body}" || true
              echo
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            return 1
          }

          # ① まず読む。anon キーなので RLS に弾かれて中身は空で返るが、
          #    問い合わせ自体は Postgres まで届いている。
          #    書きより先に置くのは、②の migration がまだ本番に入っていない間も
          #    「1本は必ず投げた」状態にしておくため。ここで落ちるのは
          #    本当に届かないとき（既に停止済み・キー失効）だけになる。
          if ! request GET "/rest/v1/trees?select=id&limit=1"; then
            echo "::error::Supabase に届きませんでした（最後の応答: HTTP ${status}）。プロジェクトが既に一時停止していないか、キーが失効していないかを確認してください。"
            exit 1
          fi
          echo "読みOK (HTTP 200)"

          # ② 1行だけ書き換える。読みだけでは「十分な活動」と数えられず
          #    停止予告が来たので、データが実際に変わる操作を足してある。
          #    404 が返るのは migration 未適用のとき（＝停止よけは効いていない）。
          if ! request POST "/rest/v1/rpc/ping" "{}"; then
            echo "::error::ping() を呼べませんでした（最後の応答: HTTP ${status}）。404 なら supabase/migrations/20260831_keepalive_ping.sql を本番の SQL Editor で実行してください。読みは通っているので即停止はしませんが、この状態では読みだけの頃と同じで、また停止予告が来ます。"
            exit 1
          fi
          echo "書きOK (HTTP 200) ―― 最終 ping: $(cat "${body}")"
