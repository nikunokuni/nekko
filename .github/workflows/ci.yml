name: CI

# push / PR のたびに「テストが通る・ビルドが通る」を自動で確認する。
# 壊れたまま気づかずに進むのを防ぐのが目的。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存インストール
        run: npm ci --no-audit --no-fund

      - name: 静的チェック
        run: npm run lint

      - name: ユニットテスト
        run: npm test

      - name: 本番ビルド
        # ビルド時に Supabase の値は不要（実行時に読む）ので、この2つはダミーで良い。
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
        run: npm run build

      # ── UI自動テスト ──
      # モック構成をビルドして実際にブラウザで操作する。実バックエンドは使わない。
      - name: ブラウザを用意
        run: npx playwright install --with-deps chromium

      - name: UI自動テスト
        run: npm run test:e2e

      # 落ちたときだけ、証跡（スクリーンショット・trace）を持ち帰る
      - name: 失敗時の証跡を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
